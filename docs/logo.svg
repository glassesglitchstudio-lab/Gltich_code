<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121520"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>
    
    <!-- Neon Orange Gradient -->
    <linearGradient id="glitchOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa044"/>
      <stop offset="50%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Cyan Glitch Offset -->
    <linearGradient id="glitchCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box with Glass Border -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="rgba(255,107,0,0.3)" stroke-width="2"/>
  <rect x="7" y="7" width="114" height="114" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <!-- Subtle Cyan Glitch Ghost Layer -->
  <path d="M80 34H46C37.1634 34 30 41.1634 30 50V78C30 86.8366 37.1634 94 46 94H82C90.8366 94 98 86.8366 98 78V60H64V72H84V78C84 79.1046 83.1046 80 82 80H46C44.8954 80 44 79.1046 44 78V50C44 48.8954 44.8954 48 46 48H80V34Z" fill="url(#glitchCyan)" opacity="0.4" transform="translate(-2.5, 1.5)"/>

  <!-- Main Stylized Geometric G Emblem -->
  <path d="M80 34H46C37.1634 34 30 41.1634 30 50V78C30 86.8366 37.1634 94 46 94H82C90.8366 94 98 86.8366 98 78V60H64V72H84V78C84 79.1046 83.1046 80 82 80H46C44.8954 80 44 79.1046 44 78V50C44 48.8954 44.8954 48 46 48H80V34Z" fill="url(#glitchOrange)" filter="url(#neonGlow)"/>

  <!-- Cyber Glitch Cut & Angle Slices -->
  <rect x="52" y="24" width="5" height="18" rx="2.5" fill="#ffd188" transform="rotate(28 52 24)"/>
  <rect x="76" y="86" width="5" height="18" rx="2.5" fill="#38bdf8" transform="rotate(28 76 86)" opacity="0.9"/>
</svg>
